<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2447" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mon entraînement" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Mon entraînement</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CALLISTHÉNIE + TAI CHI</p>
      <h1>Mon entraînement</h1>
    </div>
    <button id="installBtn" class="ghost hidden">Installer</button>
  </header>

  <main>
    <section id="today" class="view active"></section>
    <section id="program" class="view"></section>
    <section id="history" class="view"></section>
    <section id="settings" class="view"></section>
  </main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button data-view="today" class="active"><span>✓</span>Aujourd’hui</button>
    <button data-view="program"><span>▦</span>Programme</button>
    <button data-view="history"><span>◷</span>Historique</button>
    <button data-view="settings"><span>⚙</span>Réglages</button>
  </nav>

  <dialog id="exerciseDialog">
    <button class="close" aria-label="Fermer">×</button>
    <div id="exerciseDetails"></div>
  </dialog>

  <dialog id="timerDialog" class="timer-dialog">
    <button class="close" aria-label="Fermer">×</button>
    <p class="eyebrow">MINUTEUR</p>
    <h2 id="timerName">Exercice</h2>
    <div id="timerDisplay" class="timer-display">00:30</div>
    <div class="timer-actions">
      <button id="timerStart" class="primary">Démarrer</button>
      <button id="timerReset" class="secondary">Réinitialiser</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
